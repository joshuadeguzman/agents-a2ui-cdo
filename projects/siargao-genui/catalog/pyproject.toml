# Tool config for the catalog validation and codegen scripts.
# Dependencies are pinned in requirements.txt.

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "spec"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
