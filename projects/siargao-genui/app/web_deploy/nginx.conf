server {
  listen 8080;
  root /usr/share/nginx/html;
  # Flutter web file names carry no content hash, so code, config and the
  # page itself must be revalidated, or a redeploy shows stale code.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
  location ~* \.(png|jpg|webp|ttf|otf)$ {
    add_header Cache-Control "public, max-age=3600";
  }
}
